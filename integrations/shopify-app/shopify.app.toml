# Application Shopify « DMS Ducati Bruxelles » — liaison entre la boutique
# ducati-bruxelles.myshopify.com et le DMS (mission 03, docs/bible/missions/mission-03-shopify.md).
#
# client_id est rempli automatiquement par `npx @shopify/cli@latest app config link`.
# Il n'est PAS secret. Le Client secret, lui, ne va JAMAIS ici : il va dans les secrets
# des fonctions Supabase (SHOPIFY_CLIENT_SECRET).
client_id = "606259a362cbc504a191539e239bacc3"
name = "DMS Ducati Bruxelles"
application_url = "https://ducatilive.netlify.app"
embedded = false

[access_scopes]
# Produits (lecture + écriture), stock, emplacements, commandes, clients, canaux de vente (publication sur la boutique, W-8).
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_orders,read_customers,read_publications,write_publications"

[auth]
redirect_urls = [ "https://ducatilive.netlify.app/" ]

[webhooks]
api_version = "2026-07"

# Mission 03 — « Une vente sur le site crée la vente et la sortie de stock dans le DMS ».
# Shopify prévient le DMS à chaque commande ; la fonction serveur vérifie la signature
# (X-Shopify-Hmac-Sha256, calculée avec le Client secret de l'application) puis relit la commande.
# Publié par `npx @shopify/cli@latest app deploy` (depuis ce dossier, par Simon).
# Prérequis Shopify : accès aux « données client protégées » accordé à l'application
# (Dev Dashboard → application → API access requests / Protected customer data).
# Tant que le réglage « Import des commandes du site » est Arrêté dans le DMS, les appels sont ignorés.
[[webhooks.subscriptions]]
topics = [ "orders/create", "orders/paid", "orders/cancelled", "refunds/create" ]
uri = "https://ujmrosbgkvgvwfnuryna.supabase.co/functions/v1/shopify-orders"

[build]
